<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <!-- Fundo escuro (opcional, para visualização rápida) -->
  <style>
    .st-bg { fill: none; }
    .st-green { fill: #CCFF00; }
    .st-icon-star { fill: #0D0826; }
    .st-text { fill: #FFFFFF; font-family: 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; letter-spacing: 0.5px; }
  </style>

  <!-- Ícone de círculo verde com a estrela de 4 pontas -->
  <g transform="translate(5, 5)">
    <!-- Círculo verde -->
    <circle cx="20" cy="20" r="20" class="st-green" />
    
    <!-- Estrela / Brilho de 4 pontas -->
    <path class="st-icon-star" d="M 20,8 C 20,15 25,20 32,20 C 25,20 20,25 20,32 C 20,25 15,20 8,20 C 15,20 20,15 20,8 Z" />
  </g>

  <!-- Texto "CREME GALÁCTICO" -->
  <g transform="translate(58, 20)">
    <text x="0" y="0" class="st-text" font-size="14" line-height="1">CREME</text>
    <text x="0" y="15" class="st-text" font-size="14" line-height="1">GALÁCTICO</text>
  </g>
</svg>
